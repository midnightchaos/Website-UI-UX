<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Clock — WEBCRAFT</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,300;0,6..96,400;1,6..96,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0;padding:0;box-sizing:border-box; }
  body { background:#0d0d0d; color:#e8e0d0; font-family:'Space Mono',monospace; height:100vh; overflow:hidden; cursor:none; }

  #cursor { width:6px;height:6px;background:#d4a832;border-radius:50%;position:fixed;pointer-events:none;z-index:999; }
  #cursor-ring { width:24px;height:24px;border:1px solid rgba(212,168,50,0.4);border-radius:50%;position:fixed;pointer-events:none;z-index:998;transform:translate(-50%,-50%);transition:left 0.1s,top 0.1s; }

  nav {
    position:fixed;top:0;left:0;right:0;padding:1.5rem 2.5rem;
    display:flex;justify-content:space-between;align-items:center;z-index:20;
    background:linear-gradient(to bottom,rgba(13,13,13,0.95),transparent);
  }
  .back { font-size:0.6rem;letter-spacing:0.15em;color:rgba(212,168,50,0.6);text-decoration:none;border:1px solid rgba(212,168,50,0.3);padding:0.4em 0.9em;transition:all 0.2s; }
  .back:hover{color:#d4a832;border-color:#d4a832;}
  .nav-title { font-size:0.6rem;letter-spacing:0.2em;color:rgba(232,224,208,0.3); }

  .layout { display:grid; grid-template-columns: 1fr 340px; height:100vh; }

  /* Main clock */
  .main-clock-area {
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2rem;
    padding-top:4rem;
    position:relative;
  }

  .clock-outer {
    position:relative;
    width:320px;height:320px;
  }
  /* Outer ring decorations */
  .clock-outer::before {
    content:'';position:absolute;inset:-12px;
    border-radius:50%;
    border:1px solid rgba(212,168,50,0.2);
  }
  .clock-outer::after {
    content:'';position:absolute;inset:-24px;
    border-radius:50%;
    border:1px solid rgba(212,168,50,0.08);
  }

  .clock-face {
    width:320px;height:320px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #1e1e1e 0%, #0d0d0d 60%, #060606 100%);
    border:1px solid rgba(212,168,50,0.3);
    box-shadow:
      0 0 0 1px rgba(212,168,50,0.08),
      0 0 60px rgba(0,0,0,0.8),
      inset 0 0 40px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;overflow:hidden;
  }
  .clock-face::after {
    content:'';position:absolute;inset:8px;
    border-radius:50%;
    background:transparent;
    border:1px solid rgba(212,168,50,0.06);
  }

  /* Hour markers */
  .marker {
    position:absolute;top:50%;left:50%;
    transform-origin:0 0;
  }
  .marker-line {
    position:absolute;
    background:rgba(212,168,50,0.5);
    border-radius:1px;
  }

  .clock-brand {
    position:absolute;top:32%;left:50%;transform:translate(-50%,0);
    text-align:center;
  }
  .brand-name { font-family:'Bodoni Moda',serif;font-size:0.75rem;letter-spacing:0.25em;color:rgba(212,168,50,0.7); }
  .brand-sub { font-size:0.35rem;letter-spacing:0.3em;color:rgba(232,224,208,0.3);margin-top:0.2rem; }

  .hand { position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:2px; }
  #main-hour { width:5px;height:90px;background:linear-gradient(to top,#d4a832,#e8c84a);margin-left:-2.5px;box-shadow:0 0 8px rgba(212,168,50,0.4); }
  #main-min { width:3px;height:120px;background:linear-gradient(to top,#d4a832,#f0d870);margin-left:-1.5px;box-shadow:0 0 6px rgba(212,168,50,0.3); }
  #main-sec { width:1.5px;height:135px;background:#ff3c00;margin-left:-0.75px;box-shadow:0 0 6px rgba(255,60,0,0.6); }
  #main-sec::after { content:'';position:absolute;bottom:-20px;left:50%;transform:translate(-50%);width:1.5px;height:20px;background:#ff3c00;border-radius:1px; }
  .clock-center { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;background:#d4a832;border-radius:50%;box-shadow:0 0 12px rgba(212,168,50,0.6);z-index:5; }
  .clock-center::after { content:'';position:absolute;inset:3px;background:#0d0d0d;border-radius:50%; }

  .digital-time {
    font-size:clamp(1rem,3vw,1.6rem);letter-spacing:0.3em;color:rgba(212,168,50,0.8);
    font-variant-numeric:tabular-nums;
  }
  .digital-date { font-size:0.6rem;letter-spacing:0.2em;color:rgba(232,224,208,0.3);margin-top:0.3rem;text-align:center; }

  /* Sidebar world clocks */
  .sidebar {
    border-left:1px solid rgba(212,168,50,0.1);
    padding:5rem 2rem 2rem;
    display:flex;flex-direction:column;gap:0;
    overflow-y:auto;
    background:rgba(0,0,0,0.2);
  }
  .sidebar::-webkit-scrollbar{width:2px;} .sidebar::-webkit-scrollbar-thumb{background:rgba(212,168,50,0.2);}

  .world-clock {
    padding:1.2rem 0;
    border-bottom:1px solid rgba(212,168,50,0.08);
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:1rem;
  }
  .wc-city { font-size:0.6rem;letter-spacing:0.15em;color:rgba(232,224,208,0.4); }
  .wc-tz { font-size:0.45rem;letter-spacing:0.1em;color:rgba(232,224,208,0.2);margin-top:0.2rem; }
  .wc-mini { position:relative;width:48px;height:48px; }
  .wc-face {
    width:48px;height:48px;border-radius:50%;
    background:radial-gradient(circle,#1a1a1a,#0a0a0a);
    border:1px solid rgba(212,168,50,0.2);
    position:relative;
  }
  .mini-hand { position:absolute;bottom:50%;left:50%;transform-origin:bottom center; }
  .mini-h { width:2px;height:14px;background:rgba(212,168,50,0.8);margin-left:-1px; }
  .mini-m { width:1px;height:18px;background:#e8c84a;margin-left:-0.5px; }
  .mini-s { width:0.8px;height:20px;background:#ff3c00;margin-left:-0.4px; }
  .mini-c { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;background:#d4a832;border-radius:50%;z-index:5; }
  .wc-time { font-size:0.7rem;letter-spacing:0.1em;color:rgba(212,168,50,0.7);margin-top:0.3rem;font-variant-numeric:tabular-nums; }

  .sidebar-title { font-size:0.5rem;letter-spacing:0.25em;color:rgba(212,168,50,0.3);margin-bottom:1.5rem;padding-bottom:0.8rem;border-bottom:1px solid rgba(212,168,50,0.08); }

  /* Info panel */
  .info-strip {
    position:fixed;bottom:0;left:0;
    width:calc(100% - 340px);
    padding:1.5rem 2.5rem;
    background:linear-gradient(to top,rgba(13,13,13,0.98),transparent);
    z-index:20;
  }
  .tag { font-size:0.5rem;letter-spacing:0.2em;color:rgba(212,168,50,0.6);border:1px solid rgba(212,168,50,0.3);display:inline-block;padding:0.3em 0.7em;margin-bottom:0.7rem; }
  .info-title { font-family:'Bodoni Moda',serif;font-size:1.8rem;font-weight:300;line-height:1;margin-bottom:0.5rem; }
  .info-desc { font-size:0.6rem;line-height:1.8;color:rgba(232,224,208,0.4);max-width:500px; }

  @media(max-width:800px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}.info-strip{width:100%;}}
</style>
</head>
<body>
<div id="cursor"></div>
<div id="cursor-ring"></div>

<nav>
  <a href="index.html" class="back">← BACK</a>
  <span class="nav-title">06 / LIVE DOM CLOCK</span>
</nav>

<div class="layout">
  <div class="main-clock-area">
    <div class="clock-outer">
      <div class="clock-face" id="mainFace">
        <div class="clock-brand">
          <div class="brand-name">WEBCRAFT</div>
          <div class="brand-sub">DOM · ANIMATION · ENGINE</div>
        </div>
        <div class="hand" id="main-hour"></div>
        <div class="hand" id="main-min"></div>
        <div class="hand" id="main-sec"></div>
        <div class="clock-center"></div>
      </div>
    </div>
    <div>
      <div class="digital-time" id="digitalTime">00:00:00</div>
      <div class="digital-date" id="digitalDate">—</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">WORLD CLOCKS</div>
    <div id="worldClocks"></div>
  </div>
</div>

<div class="info-strip">
  <div class="tag">JAVASCRIPT / DATE API</div>
  <div class="info-title">The Living<br>Clock</div>
  <div class="info-desc">new Date() sampled every 16ms via requestAnimationFrame. Hour/minute/second angles computed with modular arithmetic and applied as CSS transform: rotate() on DOM elements.</div>
</div>

<script>
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursor-ring');
  document.addEventListener('mousemove', e => {
    cursor.style.left=e.clientX-3+'px'; cursor.style.top=e.clientY-3+'px';
    ring.style.left=e.clientX+'px'; ring.style.top=e.clientY+'px';
  });

  // Draw hour markers on main clock
  const face = document.getElementById('mainFace');
  for (let i = 0; i < 60; i++) {
    const deg = i * 6;
    const isMajor = i % 5 === 0;
    const div = document.createElement('div');
    div.style.cssText = `position:absolute;top:50%;left:50%;transform:rotate(${deg}deg);transform-origin:0 0;`;
    const line = document.createElement('div');
    const r = 148;
    const len = isMajor ? 14 : 6;
    line.style.cssText = `position:absolute;left:0;width:${isMajor?1.5:0.8}px;height:${len}px;background:rgba(212,168,50,${isMajor?0.6:0.25});transform:translate(${r}px,${-r-len}px) rotate(0deg);transform-origin:center top;border-radius:1px;`;
    div.appendChild(line);
    face.appendChild(div);
  }

  const CITIES = [
    { name:'NEW YORK', tz:'America/New_York', label:'UTC−5' },
    { name:'LONDON', tz:'Europe/London', label:'UTC±0' },
    { name:'PARIS', tz:'Europe/Paris', label:'UTC+1' },
    { name:'DUBAI', tz:'Asia/Dubai', label:'UTC+4' },
    { name:'TOKYO', tz:'Asia/Tokyo', label:'UTC+9' },
    { name:'SYDNEY', tz:'Australia/Sydney', label:'UTC+11' },
    { name:'LOS ANGELES', tz:'America/Los_Angeles', label:'UTC−8' },
    { name:'SINGAPORE', tz:'Asia/Singapore', label:'UTC+8' },
  ];

  const wc = document.getElementById('worldClocks');
  CITIES.forEach((city, idx) => {
    wc.innerHTML += `
      <div class="world-clock">
        <div>
          <div class="wc-city">${city.name}</div>
          <div class="wc-tz">${city.label}</div>
          <div class="wc-time" id="wct-${idx}">--:--</div>
        </div>
        <div class="wc-mini">
          <div class="wc-face">
            <div class="mini-hand mini-h" id="wch-${idx}"></div>
            <div class="mini-hand mini-m" id="wcm-${idx}"></div>
            <div class="mini-hand mini-s" id="wcs-${idx}"></div>
            <div class="mini-c"></div>
          </div>
        </div>
      </div>`;
  });

  const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function pad(n){ return String(n).padStart(2,'0'); }

  function update() {
    const now = new Date();
    const s = now.getSeconds() + now.getMilliseconds()/1000;
    const m = now.getMinutes() + s/60;
    const h = (now.getHours() % 12) + m/60;

    document.getElementById('main-sec').style.transform = `translateX(-50%) rotate(${s*6}deg)`;
    document.getElementById('main-min').style.transform = `translateX(-50%) rotate(${m*6}deg)`;
    document.getElementById('main-hour').style.transform = `translateX(-50%) rotate(${h*30}deg)`;

    document.getElementById('digitalTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('digitalDate').textContent = `${DAYS[now.getDay()]} ${pad(now.getDate())} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

    CITIES.forEach((city, idx) => {
      try {
        const cityNow = new Date(now.toLocaleString('en-US', {timeZone: city.tz}));
        const cs = cityNow.getSeconds() + cityNow.getMilliseconds()/1000;
        const cm = cityNow.getMinutes() + cs/60;
        const ch = (cityNow.getHours() % 12) + cm/60;
        document.getElementById(`wcs-${idx}`).style.transform = `translateX(-50%) rotate(${cs*6}deg)`;
        document.getElementById(`wcm-${idx}`).style.transform = `translateX(-50%) rotate(${cm*6}deg)`;
        document.getElementById(`wch-${idx}`).style.transform = `translateX(-50%) rotate(${ch*30}deg)`;
        document.getElementById(`wct-${idx}`).textContent = `${pad(cityNow.getHours())}:${pad(cityNow.getMinutes())}`;
      } catch(e){}
    });

    requestAnimationFrame(update);
  }
  update();
</script>
</body>
</html>
